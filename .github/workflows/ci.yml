name: Checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - name: Verify all game fonts are bundled for offline use
        run: npm run portable:verify
      - run: npm test
      - name: Training smoke test (small deterministic simulation)
        run: npm run train:smoke
      - name: Training equivalence and guardrails
        run: node scripts/advanced.test.cjs
      - name: Autonomiczny self-play (mały test)
        run: npm run learn:smoke
