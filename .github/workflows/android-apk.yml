name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'scripts/verify-portable-assets.cjs'
      - 'capacitor.config.ts'
      - 'scripts/configure-android-landscape.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms"
          find "$ANDROID_HOME/platforms" -maxdepth 1 -name 'android-*' -print
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and verify bundled game assets
        run: |
          npm run build
          npm run portable:verify
      - name: Create native Android project
        run: npx cap add android
      - name: Apply landscape orientation
        run: node scripts/configure-android-landscape.mjs
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SintraGlass-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
