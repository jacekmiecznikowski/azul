name: Android APK (debug)

on:
  push:
    branches:
      - feat/android-apk
  pull_request:
    branches:
      - fix/physical-table-readable-v7
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub-hosted Ubuntu runners already include an Android SDK.
      # Avoid setup-android@v3: recent sdkmanager repositories removed the "tools" package.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          find "$ANDROID_HOME/platforms" -maxdepth 1 -name 'android-*' -print

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Generate native Android project
        run: npx cap add android

      - name: Landscape layout
        run: node scripts/configure-android-landscape.mjs

      - name: Copy web assets into Android
        run: npx cap sync android

      - name: Assemble installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sintra-glass-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
